[project]
name = "brand-dossier"
version = "0.1.0"
description = "Analisa posts de social media (imagem + legenda) com Claude e gera um dossiê de comunicação da marca."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5,<2",
    "streamlit>=1.40",
    "pydantic>=2.7",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brand_dossier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
